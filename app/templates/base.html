<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="app-navbar">
        <div class="container app-navbar-inner">
            <a class="app-brand" href="/">
                <svg class="app-brand-mark" width="32" height="32" viewBox="0 0 32 32"
                     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <defs>
                        <linearGradient id="vireloGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#6366f1"/>
                            <stop offset="1" stop-color="#4338ca"/>
                        </linearGradient>
                    </defs>
                    <path d="M9 1 H23 L31 9 V23 A9 9 0 0 1 22 32 H9 A9 9 0 0 1 0 23 V10 A9 9 0 0 1 9 1 Z"
                          fill="url(#vireloGrad)"/>
                    <path d="M23 1 L31 9 L23 9 Z" fill="#ffffff" fill-opacity="0.22"/>
                    <path d="M10 11 L16 21 L22 11"
                          stroke="#ffffff" stroke-width="2.6"
                          stroke-linecap="round" stroke-linejoin="round"
                          fill="none"/>
                </svg>
                <span class="app-brand-name">Virelo</span>
            </a>
            <div class="app-nav-links">
                <a class="app-nav-link {% if request.url.path.startswith('/invoices') %}is-active{% endif %}"
                   href="/invoices">Invoices</a>
                <a class="app-nav-link {% if request.url.path.startswith('/upload') %}is-active{% endif %}"
                   href="/upload">Upload</a>
            </div>
        </div>
    </nav>

    <main class="container app-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
