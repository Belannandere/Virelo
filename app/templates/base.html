<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="app-navbar">
        <div class="container app-navbar-inner">
            <a class="app-brand" href="/">
                <span class="app-brand-mark" aria-hidden="true"></span>
                <span class="app-brand-name">Virelo</span>
            </a>
            <div class="app-nav-links">
                <a class="app-nav-link {% if request.url.path.startswith('/invoices') %}is-active{% endif %}" href="/invoices">Invoices</a>
                <a class="app-nav-link {% if request.url.path.startswith('/upload') %}is-active{% endif %}" href="/upload">Upload</a>
            </div>
        </div>
    </nav>

    <main class="container app-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
